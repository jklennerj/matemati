<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades de matemática</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor {
            width: min(500px, 90%);
            background: white;
            padding: clamp(24px, 6vw, 40px);
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .12);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 35px;
            color: #1f2937;
        }

        .actividades a {
            display: block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 16px;
            margin: 15px 0;
            border-radius: 10px;
            font-size: 1.15em;
            transition: background .25s, transform .25s;
        }

        .actividades a:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .actividades a:focus-visible {
            outline: 3px solid #1f2937;
            outline-offset: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            .actividades a {
                transition: none;
            }

            .actividades a:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <main class="contenedor">
        <h1>Actividades de matemática</h1>

        <nav class="actividades" aria-label="Actividades disponibles">
            <!-- Agregar aquí un enlace por cada nueva actividad. -->
            <a href="espejos.htm">Espejos</a>
            <a href="triangulo_000.htm">Triángulo</a>
        </nav>
    </main>
</body>
</html>
